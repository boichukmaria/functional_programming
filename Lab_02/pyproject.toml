[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["lab2/lab2.py", "lab2/main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
